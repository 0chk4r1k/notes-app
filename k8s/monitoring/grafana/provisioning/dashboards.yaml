apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-dashboard
  namespace: monitoring
data:
  backend.json: |
    {
      "title": "Backend Metrics",
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate",
          "targets": [
            {
              "expr": "http_requests_total",
              "legendFormat": "{{method}} {{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request Duration",
          "targets": [
            {
              "expr": "http_request_duration_seconds_sum",
              "legendFormat": "{{method}}"
            }
          ]
        }
      ],
      "schemaVersion": 38,
      "version": 1
    }
