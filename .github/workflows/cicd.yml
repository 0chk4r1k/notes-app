name: CI/CD Pipeline

on:
  push:
    branches: [prod]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ================= BACKEND =================
  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME/backend:${{ github.sha }} \
            ./backend

          docker push $REGISTRY/$IMAGE_NAME/backend:${{ github.sha }}

  # ================= FRONTEND =================
  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push frontend
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }} \
            ./frontend

          docker push $REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }}

  # ================= DEPLOY =================
  deploy:
    needs: [backend, frontend, detect-changes]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          kubectl set image deployment/backend \
            backend=$REGISTRY/$IMAGE_NAME/backend:${{ github.sha }} \
            -n notes

      - name: Deploy frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          kubectl set image deployment/frontend \
            frontend=$REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }} \
            -n notes

      - name: Wait rollout backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: kubectl rollout status deployment/backend -n notes

      - name: Wait rollout frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: kubectl rollout status deployment/frontend -n notes
