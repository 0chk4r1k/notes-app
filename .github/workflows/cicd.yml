name: CI/CD Pipeline

on:
  push:
    branches: [prod]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ================= BUILD BACKEND =================
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME/backend:${{ github.sha }} \
            ./backend

      - name: Push backend
        run: |
          docker push $REGISTRY/$IMAGE_NAME/backend:${{ github.sha }}

  # ================= BUILD FRONTEND =================
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend
        run: |
          docker push $REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }}

  # ================= DEPLOY =================
  deploy:
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy backend
        run: |
          kubectl set image deployment/backend \
            backend=$REGISTRY/$IMAGE_NAME/backend:${{ github.sha }} \
            -n notes

      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=$REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }} \
            -n notes

      - name: Rollout status
        run: |
          kubectl rollout status deployment/backend -n notes
          kubectl rollout status deployment/frontend -n notes
