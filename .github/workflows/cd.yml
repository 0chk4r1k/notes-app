name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build Artifacts"]
    types:
      - completed
    branches: [prod]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy backend
        run: |
          kubectl set image deployment/backend \
            backend=$REGISTRY/$IMAGE_NAME/backend:${{ github.event.workflow_run.head_sha }} \
            -n notes

      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=$REGISTRY/$IMAGE_NAME/frontend:${{ github.event.workflow_run.head_sha }} \
            -n notes

      - name: Rollout status
        run: |
          kubectl rollout status deployment/backend -n notes
          kubectl rollout status deployment/frontend -n notes
