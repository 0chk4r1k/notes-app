name: Build Artifacts

on:
  push:
    branches: [prod]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    if: contains(github.event.head_commit.message, 'backend') || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME/backend:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME/backend:prod \
            ./backend

      - name: Push backend
        run: |
          docker push $REGISTRY/$IMAGE_NAME/backend:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME/backend:prod

  frontend:
    if: contains(github.event.head_commit.message, 'frontend') || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME/frontend:prod \
            ./frontend

      - name: Push frontend
        run: |
          docker push $REGISTRY/$IMAGE_NAME/frontend:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME/frontend:prod
